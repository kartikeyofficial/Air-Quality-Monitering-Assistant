<div class="auth-container">

  <div class="auth-card">

    <h1>Air Quality Assistant</h1>

    <h2>Create Account</h2>

    <form (ngSubmit)="register()">

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
        />

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        />

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Minimum 8 characters"
        />

      </div>

      <p
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Creating...' : 'Register' }}
      </button>

    </form>

    <p>
      Already have an account?

      <button
        type="button"
        class="link-button"
        (click)="goToLogin()"
      >
        Login
      </button>
    </p>

  </div>

</div>
